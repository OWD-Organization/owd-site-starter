name: SEO gate (warnings only)

# Prints the build and the SEO report on every pull request.
# VERCEL_ENV is preview here, so the gate cannot fail this job.
# The build step always exits 0. Production blocking happens only on Vercel,
# where VERCEL_ENV=production is set automatically. Do not set that variable,
# or SITE_INDEXABLE, in GitHub.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-gate:
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build + SEO gate (warnings only, does not fail the PR)
        run: |
          set +e
          npm run build
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=SEO gate::Build or gate exited ${status}. This job is warnings-only and does not fail the pull request."
          fi
          exit 0
      - name: Gate self-test
        run: npm run test:gate
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-gate-report
          path: .owd/seo-gate-report.*
